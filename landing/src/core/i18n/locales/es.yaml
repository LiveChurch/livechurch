faq:
  title: "Preguntas frecuentes"
  items:
    - question: "¿Es gratis de verdad?"
      answer: "Sí. LiveChurch es totalmente gratuito y todas las funciones vienen en la misma descarga."
    - question: "¿Necesito internet durante el culto?"
      answer: "La Biblia (Reina-Valera 1909, Biblia en Español Sencillo y Versión Biblia Libre), las diapositivas libres y la agenda funcionan sin conexión. Internet se usa para buscar letras de otras canciones y las imágenes de fondo de los temas."
    - question: "¿Puedo proyectar la letra de cualquier canción?"
      answer: "Sí. Busca por el título y el programa trae la letra de internet y la divide en diapositivas, que aún puedes editar. Esto depende de que el servicio de letras esté disponible."
    - question: "¿En qué computadores funciona?"
      answer: "Windows y Linux."
    - question: "¿Puedo proyectar en un televisor o proyector?"
      answer: "Sí. Conecta la pantalla, elige el monitor en el pie del programa y la proyección se abre a pantalla completa en él, mientras controlas todo desde la ventana principal."
    - question: "¿Un voluntario sin experiencia puede operarlo?"
      answer: "Todo empieza en la barra de búsqueda: escribes, eliges el resultado y revisas la vista previa de la diapositiva antes de enviarla a la pantalla."
    - question: "¿En qué idioma está el programa?"
      answer: "La interfaz está en portugués, inglés y español, y cada idioma tiene sus propias versiones de la Biblia. Las capturas de esta página muestran la interfaz en portugués."
    - question: "¿LiveChurch es de código abierto?"
      answer: "Sí. El proyecto es de código abierto y está en GitHub, en github.com/LiveChurch."
    - question: "¿El programa sigue en beta?"
      answer: "Sí, y puede presentar inestabilidades. Recomendamos probarlo antes del culto."

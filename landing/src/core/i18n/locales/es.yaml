      - "Fuente, tamaño y posición del texto"
      - "Transiciones entre diapositivas y efectos"
    imageAlt: "Editor de temas de LiveChurch con fondos y vista previa de la diapositiva"
  freeSlides:
    label: "Diapositivas libres"
    title: "Crea diapositivas con cualquier texto"
    text: "Escribe avisos, oraciones o el programa del día. Una línea en blanco separa una diapositiva de otra, y la lista de diapositivas muestra el resultado mientras escribes."
    bullets:
      - "Avisos, oraciones y programa"
      - "Vista previa al instante"
      - "Imágenes y videos a pantalla completa"
    imageAlt: "Editor de diapositivas libres con vista previa de la división en diapositivas"
  calendar:

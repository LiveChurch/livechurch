    label: "Temas"
    title: "Elige el aspecto de las diapositivas"
    text: "Cada diapositiva usa un tema con imagen de fondo, fuente, degradado, transición y efectos como brasas. Cambia el tema con un clic o deja que el programa elija uno al azar."
    bullets:

finalCta:
  title: "Download LiveChurch for free."
  text: "Install it on the big-screen computer and have lyrics and Bible ready before Sunday."
features:
  search:
    label: "Search"
    title: "Search lyrics and verses"
    text: "One search bar finds song lyrics, Bible verses and actions such as creating announcements and generating the schedule."
    bullets:
      - "Lyrics of any song, split into slides (needs internet)"
      - "“john 3:16” jumps straight to the verse"
      - "“create” and “events” open announcements and the schedule"
    imageAlt: "LiveChurch search bar suggesting Psalm 23"
  themes:
    label: "Themes"
    title: "Pick the look of your slides"
    text: "Each slide uses a theme with a background image, font, gradient, transition and effects such as embers. Switch themes with one click or let the program pick a random one."
    bullets:
      - "Image and animated backgrounds"
      - "Font, size and text position"
      - "Slide transitions and effects"
    imageAlt: "LiveChurch theme editor with backgrounds and slide preview"
  freeSlides:
    label: "Free-form slides"
    title: "Create slides from any text"
    text: "Write announcements, prayers or the day’s program. A blank line separates one slide from the next, and the slide list shows the result as you type."
    bullets:
      - "Announcements, prayers and program"
      - "Instant slide preview"
      - "Full-screen images and videos"
    imageAlt: "Free-form slide editor previewing how the text splits into slides"
  calendar:
    label: "Schedule"
    title: "Generate the events slide"
    text: "Add one-off, weekly or monthly events. Then choose the period and the program creates slides with the date, time and title of each event."
    bullets:
      - "Weekly and monthly events"
      - "This week, next week or this month"
      - "Type “events” in the search bar to generate"
    imageAlt: "LiveChurch calendar with weekly events"
  bible:
    label: "Bible"
    title: "Bible on the big screen"
    text: "King James Version, World English Bible and American Standard Version come built in. Pick a verse and it becomes a slide, ready to show."
    bullets:
      - "Browse by chapter without leaving the slide"
      - "Works offline"
    image: "bible-live"
    imageAlt: "Bible verse shown on the big screen by LiveChurch"
moreFeatures:
  playlist:
    title: "Service playlist"
    text: "Build the order of service with songs, verses, announcements, images and videos. Everything is saved on your computer."
  preview:
    title: "Preview before showing"
    text: "Check the slide in the preview and only then click Show. What is live appears next to it."
  projector:
    title: "Big screen or projector"
    text: "Pick the monitor in the footer and the projection opens full screen, while you control everything from the main window."
  templates:
    title: "Announcement templates"
    text: "Create a template with fields like #Name and, for each announcement, fill in only the fields."
  quickEdit:
    title: "Quick edit"
    text: "Fix a lyric or a text on the spot with Ctrl+E, during the service."
  colorMode:
    title: "Light and dark theme"
    text: "Switch between the two modes inside the program."
faq:
  title: "Frequently asked questions"
  items:
    - question: "Is it really free?"
      answer: "Yes. LiveChurch is completely free and every feature comes in the same download."
    - question: "Do I need internet during the service?"
      answer: "The Bible (KJV, WEB and ASV), free-form slides and the schedule work offline. The internet is used to fetch lyrics of other songs and the theme background images."
    - question: "Can I project the lyrics of any song?"
      answer: "Yes. Search by title and the program fetches the lyrics from the internet and splits them into slides, which you can still edit. This depends on the lyrics service being available."
    - question: "Which computers does it run on?"
      answer: "Windows and Linux."
    - question: "Can I project on a TV or projector?"
      answer: "Yes. Connect the screen, pick the monitor in the program’s footer and the projection opens full screen on it, while you control everything from the main window."
    - question: "Can a volunteer with no experience operate it?"
      answer: "Everything starts in the search bar: you type, pick the result and check the slide preview before sending it to the big screen."
    - question: "In which language is the program?"
      answer: "The interface comes in Portuguese, English and Spanish, and each language has its own Bible versions. The screenshots on this page show the Portuguese interface."
    - question: "Is LiveChurch open source?"
      answer: "Yes. The project is open source and lives on GitHub, at github.com/LiveChurch."
    - question: "Is the program still in beta?"
      answer: "Yes, and it may have instabilities. We recommend testing before the service."
